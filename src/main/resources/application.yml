spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/gato_db
    username: gato
    password: gato
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    root: INFO
    com.example.gato: DEBUG

app:
  jwt:
    secret: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789ab0123456789abcdef0123456789abcdef0123456789abcdef0123456789ab'
    expiryMinutes: 60
  passwordReset:
    tokenTtlMinutes: 30
  mail:
    fromAddress: ${MAIL_FROM_ADDRESS:no-reply@gato.local}
    fromName: ${MAIL_FROM_NAME:Gato}
