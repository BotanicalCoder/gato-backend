version: "3.9"
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gato_db
      POSTGRES_USER: gato
      POSTGRES_PASSWORD: gato
    volumes: [dbdata:/var/lib/postgresql/data]
  api:
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/gato_db
      SPRING_DATASOURCE_USERNAME: gato
      SPRING_DATASOURCE_PASSWORD: gato
      APP_JWT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789ab
      APP_JWT_EXPIRYMINUTES: 60
    ports: ["8080:8080"]
    depends_on: [db]
volumes:
  dbdata:
